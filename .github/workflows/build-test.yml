name: Build & Test & SonarQube

# A pull request runs this once, through pull_request: it tests the branch merged into its target
# and SonarCloud reports on the pull request. push covers only the long-lived branch, so a commit
# on a pull request does not run everything a second time; any other branch can be run by hand.
on:
  push:
    branches: [development]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test & SonarQube
    runs-on: ubuntu-latest

    env:
      # Empty when the run gets no Actions secrets: on a pull request from a fork, and on one that
      # Dependabot opens (Dependabot runs get only Dependabot secrets, so add SONAR_TOKEN there too
      # to have its pull requests analysed). The analysis is then skipped; the build and the tests
      # still run.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          overwrite-settings: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install spec-extract dependencies (Python)
        # Installed from uv.lock, the lock `uml4net-sage generate` installs from through uv, so this
        # tests the versions users get. uv is the version Uml4Net.Sage.Knowledge pins
        # (UvProvisioner.PinnedVersion); keep the two in step. Wheels only (--no-build), the lock
        # unchanged (--frozen), and spec-extract itself not installed (the tests import it from src).
        # Prepending the venv's bin to PATH lets the later ruff and pytest steps run from it.
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          python -m pip install --only-binary :all: uv==0.12.10
          cd tools/spec-extract
          uv sync --frozen --extra dev --no-install-project --no-build --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Nuget.Config') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore uml4net-sage.slnx

      - name: SonarQube begin
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_SCANNER_OPTS: "-Xmx4096m"
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 12.0.0
          dotnet sonarscanner begin /k:"STARIONGROUP_uml4net-sage" /o:"stariongroup" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.python.coverage.reportPaths="tools/spec-extract/coverage.xml" /d:sonar.python.version="3.12" /d:sonar.test.inclusions="**/spec-extract/tests/**/*"

      - name: Build
        run: dotnet build uml4net-sage.slnx --no-restore --no-incremental /p:ContinuousIntegrationBuild=true

      - name: Run tests and compute coverage
        run: |
          dotnet tool install --global dotnet-coverage --version 18.12.0
          dotnet-coverage collect "dotnet test uml4net-sage.slnx --no-restore --no-build --verbosity normal" -f xml -o "coverage.xml"


      - name: Lint Python (ruff)
        working-directory: tools/spec-extract
        run: |
          ruff check .
          ruff format --check .

      - name: Test Python and compute coverage
        working-directory: tools/spec-extract
        # Import from the src layout without an editable (source-build) install.
        env:
          PYTHONPATH: src
        run: pytest -v --cov=spec_extract --cov-report=xml

      - name: Assert the tests wrote nothing
        # Generation is `uml4net-sage generate`'s job; the tests verify. After both the .NET and the
        # Python tests, the working tree must be as checked out: no tracked file changed and no new
        # file that .gitignore does not cover (the coverage reports and caches are ignored).
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::the test run changed the working tree; tests must not write the repository"
            exit 1
          fi

      - name: SonarQube end
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
