[project]
name = "spec-extract"
version = "1.0.0"
description = "PDF-to-markdown clause extraction for the OMG UML 2.5.1 specification. Ported from mycelium-hypha's tools/spec-extract."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pdfplumber>=0.11,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a real, locally-supplied OMG UML spec PDF (set UML_SPEC_PDF_PATH); never fetched or committed by the test itself",
]
